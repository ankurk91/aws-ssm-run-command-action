services:
  moto:
    image: motoserver/moto:5.2.3
    container_name: moto
    restart: no
    ports:
      # moto serves on 5000; published as 4566 so AWS_ENDPOINT_URL stays what it always was.
      - "127.0.0.1:4566:5000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5000/moto-api/ || exit 1" ]
