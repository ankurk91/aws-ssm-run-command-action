name: localstack-test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 18 * *'

permissions:
  contents: read


jobs:
  localstack:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      localstack:
        image: localstack/localstack:4.14
        ports:
          - 4566:4566
        env:
          SERVICES: ec2,s3,ssm,iam,sts
          DEBUG: 0
        options: >-
          --health-cmd="curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Test the action
        run: bash ./localstack.sh
