name: EC2-Test

# Test on an actual EC2
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ec2:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Build action
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Execute this action
        uses: ./
        id: ssm-run
        with:
          ec2_instance_id: ${{ vars.EC2_INSTANCE_ID }}
          run_as_user: ubuntu
          log_bucket_name: ${{ secrets.LOG_BUCKET_NAME }}
          commands: |
            set -euo
            pwd
            cd /home/ubuntu
            ls -al
            sleep 4s
            echo -e '\033[32mColorful text\033[0m'
            echo "Hello from EC2"

      - name: Assert command exit code is 0
        uses: nick-fields/assert-action@v4
        with:
          expected: 0
          actual: ${{ steps.ssm-run.outputs.command-exit-code }}
